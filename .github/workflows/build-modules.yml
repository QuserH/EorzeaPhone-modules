name: Build modules

on:
  push:
    branches: [ main ]
    paths:
      - 'modules/**'
      - 'api/**'
      - 'tools/**'
      - '.github/workflows/build-modules.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build module dex
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          PLAT=$(ls "$SDK/platforms" | grep -E '^android-[0-9]+$' | sort -V | tail -1)
          echo "build-tools=$BT platform=$PLAT"
          mkdir -p out
          for dir in modules/*/; do
            id=$(basename "$dir")
            [ -f "$dir/module.json" ] || continue
            gradle ":modules:$id:module:assembleRelease" --no-daemon --console=plain
            jar="modules/$id/module/build/intermediates/aar_main_jar/release/syncReleaseLibJars/classes.jar"
            [ -f "$jar" ] || { echo "missing classes.jar for $id"; exit 1; }
            mkdir -p "out/$id"
            "$SDK/build-tools/$BT/d8" --release --min-api 24 \
              --lib "$SDK/platforms/$PLAT/android.jar" \
              --output "out/$id" "$jar"
          done

      - name: Package and update index
        run: python3 tools/publish.py out

      - name: Commit published modules
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json packages
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "build: publish modules [skip ci]"
            git push
          fi
